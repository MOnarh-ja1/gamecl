*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#8dc9ef;font-family:system-ui,-apple-system,Arial;color:white;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;height:100dvh;height:var(--screen-h,100dvh)}#hud,#start{height:100%;height:100dvh;height:var(--screen-h,100dvh)}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-size:16px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 8px #1a233a55}.score{border:1px solid #ffffff55;background:#10273bb5;backdrop-filter:blur(12px);border-radius:16px;padding:10px 15px;font-size:16px;font-weight:800;box-shadow:0 6px 20px #0002}.coin{color:#ffd45c}.mini{font-size:11px;font-weight:600;color:#dceeff}#hint{position:absolute;top:calc(env(safe-area-inset-top) + 65px);left:16px;right:16px;text-align:center;font-size:12px;text-shadow:0 1px 4px #0008;opacity:.85}#joystick{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);left:26px;width:130px;height:130px;border:2px solid #ffffff66;border-radius:50%;background:#0b24425e;backdrop-filter:blur(5px);pointer-events:auto;touch-action:none}#stick{position:absolute;width:58px;height:58px;left:34px;top:34px;border:2px solid #ffffffb5;background:linear-gradient(150deg,#ffffffa8,#a3c6e0a0);border-radius:50%;box-shadow:0 4px 20px #0004}#actions{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom) + 43px);display:flex;align-items:end;gap:12px;pointer-events:auto}.action{border:2px solid #ffffff94;border-radius:50%;color:white;font-weight:900;font-size:14px;letter-spacing:1px;background:#124569a8;backdrop-filter:blur(8px);box-shadow:0 5px 15px #10233845;width:80px;height:80px;touch-action:none}.action:active{transform:scale(.95);background:#248aca}.small{width:60px;height:60px;font-size:22px}#toast{position:absolute;top:27%;width:100%;text-align:center;font-weight:900;font-size:22px;text-shadow:0 3px 8px #1236;opacity:0;transition:opacity .2s}#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,#0a2446e8,#122b40c9);z-index:10;padding:24px}#start.hidden{display:none}.panel{border:1px solid #ffffff32;background:#0b2438d4;backdrop-filter:blur(18px);border-radius:26px;padding:30px;max-width:390px;width:100%;text-align:center;box-shadow:0 25px 75px #0017}.panel h1{margin:0;font-size:32px;letter-spacing:2px}.panel p{font-size:14px;line-height:1.55;color:#d1e8fa}.startbtn{margin-top:15px;border:0;border-radius:14px;padding:16px 48px;color:#142b2b;background:#77e5b5;font-weight:900;font-size:17px;box-shadow:0 5px 0 #3ca57a;cursor:pointer}.startbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #3ca57a}#load{font-size:12px;color:#b8ddf5;min-height:18px;margin-top:18px}#reset{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 10px);left:50%;transform:translateX(-50%);border:0;border-radius:9px;background:#12324988;color:#fff9;padding:7px 12px;font-size:11px;pointer-events:auto}#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d2638ef;z-index:20;text-align:center;padding:30px;font-size:20px;font-weight:700}@media (orientation:portrait){#joystick{width:112px;height:112px;left:18px;bottom:calc(env(safe-area-inset-bottom) + 22px)}#stick{width:50px;height:50px;left:29px;top:29px}#actions{right:16px;bottom:calc(env(safe-area-inset-bottom) + 26px)}.action{width:70px;height:70px}.small{width:55px;height:55px}#hint{font-size:11px}}@media (max-height:420px){#joystick{width:108px;height:108px;bottom:calc(env(safe-area-inset-bottom) + 18px)}#stick{left:27px;top:27px;width:50px;height:50px}#actions{bottom:calc(env(safe-area-inset-bottom) + 23px)}.action{width:68px;height:68px}.small{width:54px;height:54px}#hi </style></head><body><div id="hud"><div id="top"><span class="logo">ISLAND <span style="color:#88f5c4">RUN</span></span><div class="score"><span class="coin">●</span> <span id="score">0</span> <span class="mini">/ 20</span></div></div><div id="hint">Левый палец — движение • Правый — камера</div><div id="joystick"><div id="stick"></div></div><div id="actions"><button class="action small" id="sprint" aria-label="Бег">⚡</button><button class="action" id="jump">ПРЫЖОК</button></div><div id="toast"></div><button id="reset">↻ Начать заново</button></div><div id="start"><div class="panel"><h1>ISLAND <span style="color:#77e5b5">RUN</span></h1><p>Прогуляйся по красивому острову, собирай золотые монеты, прыгай и исследуй мир от третьего лица.</p><p>🕹️ Джойстик слева &nbsp; 📷 Камера справа<br>⚡ Бег &nbsp; ⬆ Прыжок</p><button class="startbtn" id="play">ИГРАТЬ</button><div id="load">Подготовка 3D-мира…</div></div></div><div id="rotate">↻<br>Поверни телефон горизонтально для удобной игры</div><script type="module">
let THREE;const loadLabel=document.getElementById('load');try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js')}catch(e){try{THREE=await import('https://esm.sh/three@0.160.1')}catch(e2){loadLabel.textContent='Не удалось загрузить 3D. Подключи интернет и обнови страницу.';document.getElementById('play').disabled=true;throw e2}}
const scene=new THREE.Scene();scene.background=new THREE.Color('#90c8ec');scene.fog=new THREE.Fog('#90c8ec',45,120);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.08,180);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7f1ff,0x567146,2.3));const sun=new THREE.DirectionalLight(0xfff2d2,2.5);sun.position.set(-23,40,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const groundMat=mat('#75bd6a'),sandMat=mat('#dec795'),waterMat=mat('#59aeda',.35);let world=new THREE.Mesh(new THREE.PlaneGeometry(300,300),waterMat);world.rotation.x=-Math.PI/2;world.position.y=-.55;scene.add(world);const island=new THREE.Mesh(new THREE.CylinderGeometry(49,52,3,80),sandMat);island.position.y=-1.55;island.receiveShadow=true;scene.add(island);const grass=new THREE.Mesh(new THREE.CylinderGeometry(47,49,1,80),groundMat);grass.position.y=-.5;grass.receiveShadow=true;scene.add(grass);
const path=new THREE.Mesh(new THREE.RingGeometry(9,12,80),mat('#a6c681'));path.rotation.x=-Math.PI/2;path.position.y=.012;scene.add(path);
const box=(w,h,d,m,x,y,z,cast=true)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o};const trunkMat=mat('#846448'),leafMats=['#377e56','#409563','#51a76b'].map(x=>mat(x));function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.38*s,2.6*s,7),trunkMat);trunk.position.set(x,1.3*s,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<3;i++){const a=new THREE.Mesh(new THREE.IcosahedronGeometry((1.42-i*.17)*s,1),leafMats[i]);a.position.set(x+(i%2?.28:-.16)*s,(2.8+i*.8)*s,z);a.castShadow=true;scene.add(a)}}let seed=65;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<75;i++){let a=rand()*Math.PI*2,r=14+rand()*30,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<8&&z>5&&z<20)continue;tree(x,z,.65+rand()*.8)}const rockM=mat('#909b96');for(let i=0;i<48;i++){const a=rand()*6.283,r=13+rand()*32;let o=new THREE.Mesh(new THREE.DodecahedronGeometry(.35+rand()*.7,0),rockM);o.position.set(Math.cos(a)*r,.25,Math.sin(a)*r);o.scale.set(1.4,.6,1);o.castShadow=true;scene.add(o)}
// Small village
const roof=mat('#d16f5b'),walls=mat('#f4e7cb'),door=mat('#725144');for(const [x,z,s] of [[-7,-13,1],[6,-19,1.25],[17,10,.85]]){box(5*s,3*s,4*s,walls,x,1.5*s,z);let top=new THREE.Mesh(new THREE.ConeGeometry(4*s,2.4*s,4),roof);top.position.set(x,4*s,z);top.rotation.y=Math.PI/4;top.castShadow=true;scene.add(top);box(.95*s,1.8*s,.07,door,x, .9*s,z+2*s+.05);box(.9*s,.9*s,.08,mat('#85c7e0'),x-1.5*s,1.9*s,z+2*s+.07)}
// Character: shirt, shorts, shoes, hair and articulated arms/legs
const player=new THREE.Group();scene.add(player);const skin=mat('#e3b48e'),shirt=mat('#f2f5fa'),shorts=mat('#334f83'),shoe=mat('#f3f4f8'),hair=mat('#4c3428');const body=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.66,5,10),shirt);body.position.y=1.52;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),skin);head.position.y=2.35;head.castShadow=true;player.add(head);const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.327,16,12,0,Math.PI*2,0,Math.PI*.47),hair);hairCap.position.y=2.4;player.add(hairCap);for(const x of [-.12,.12]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.027,8,8),mat('#2d2d2d'));eye.position.set(x,2.39,.3);player.add(eye)}const limbs={};for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.53,1.93,0);const armMesh=new THREE.Mesh(new THREE.CapsuleGeometry(.115,.65,4,8),skin);armMesh.position.y=-.38;armMesh.castShadow=true;arm.add(armMesh);player.add(arm);limbs[side<0?'leftArm':'rightArm']=arm;const leg=new THREE.Group();leg.position.set(side*.23,1.05,0);const s=new THREE.Mesh(new THREE.CapsuleGeometry(.165,.3,4,8),shorts);s.position.y=-.16;leg.add(s);const l=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.42,4,8),skin);l.position.y=-.58;l.castShadow=true;leg.add(l);const sh=new THREE.Mesh(new THREE.BoxGeometry(.31,.19,.47),shoe);sh.position.set(0,-.94,.12);sh.castShadow=true;leg.add(sh);player.add(leg);limbs[side<0?'leftLeg':'rightLeg']=leg}player.position.set(0,0,6);
const coinM=new THREE.MeshStandardMaterial({color:'#ffca38',metalness:.7,roughness:.18,emissive:'#7e4800',emissiveIntensity:.25});const coins=[];for(let i=0;i<20;i++){let a=i*2.399,r=7+(i%5)*6.5;let x=Math.cos(a)*r,z=Math.sin(a)*r;const coin=new THREE.Mesh(new THREE.TorusGeometry(.36,.12,8,18),coinM);coin.position.set(x,1.05,z);coin.castShadow=true;coin.userData={base:1.05,active:true};scene.add(coin);coins.push(coin)}
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let move={x:0,y:0},joyId=null,camId=null,lastCamX=0,lastCamY=0,yaw=0,pitch=.28,jumpRequest=false,run=false;function moveStick(x,y){const rect=joy.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let dx=x-cx,dy=y-cy;const max=rect.width*.3,dist=Math.hypot(dx,dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max}move.x=dx/max;move.y=-dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveStick(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveStick(e.clientX,e.clientY)});function endJoy(e){if(e.pointerId===joyId){joyId=null;move={x:0,y:0};stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
renderer.domElement.addEventListener('pointerdown',e=>{if(camId===null){camId=e.pointerId;lastCamX=e.clientX;lastCamY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==camId)return;const dx=e.clientX-lastCamX,dy=e.clientY-lastCamY;lastCamX=e.clientX;lastCamY=e.clientY;yaw-=dx*.005;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.17,.9)});function endCam(e){if(camId===e.pointerId)camId=null}renderer.domElement.addEventListener('pointerup',endCam);renderer.domElement.addEventListener('pointercancel',endCam);
const jump=document.getElementById('jump'),sprint=document.getElementById('sprint');jump.addEventListener('pointerdown',e=>{e.preventDefault();jumpRequest=true});sprint.addEventListener('pointerdown',e=>{e.preventDefault();run=true;sprint.setPointerCapture(e.pointerId)});for(let evt of ['pointerup','pointercancel','lostpointercapture'])sprint.addEventListener(evt,()=>run=false);const keys=new Set();document.addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')jumpRequest=true});document.addEventListener('keyup',e=>keys.delete(e.code));
let score=0,velY=0,grounded=true,walking=0,playing=false,toastTimer=0;function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,1200)}document.getElementById('play').onclick=()=>{playing=true;document.getElementById('start').classList.add('hidden');const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement){el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});} }; function reset(){score=0;document.getElementById('score').textContent='0';player.position.set(0,0,6);velY=0;coins.forEach(c=>{c.visible=true;c.userData.active=true});showToast('Новый забег!')}document.getElementById('reset').onclick=reset;loadLabel.textContent='Мир готов!';
const clock=new THREE.Clock(),lookAt=new THREE.Vector3();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),time=clock.elapsedTime;if(playing){let x=move.x,z=move.y;if(keys.has('KeyW')||keys.has('ArrowUp'))z+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))z-=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))x-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))x+=1;const len=Math.hypot(x,z);if(len>.1){x/=Math.max(1,len);z/=Math.max(1,len);const speed=(run||keys.has('ShiftLeft')?9:5.1);const xx=(x*Math.cos(yaw)+z*Math.sin(yaw))*speed*dt,zz=(-x*Math.sin(yaw)+z*Math.cos(yaw))*speed*dt;const nx=player.position.x+xx,nz=player.position.z+zz;if(nx*nx+nz*nz<44*44){player.position.x=nx;player.position.z=nz}const targetAngle=Math.atan2(xx,zz);let diff=((targetAngle-player.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;player.rotation.y+=diff*Math.min(1,dt*12);walking+=dt*(run?15:10)}const stride=len>.1?Math.sin(walking)*.57:0;for(const [name,sign] of [['leftLeg',1],['rightLeg',-1],['leftArm',-1],['rightArm',1]])limbs[name].rotation.x=THREE.MathUtils.lerp(limbs[name].rotation.x,stride*sign,Math.min(1,dt*12));if(jumpRequest&&grounded){velY=8.1;grounded=false}jumpRequest=false;velY-=20*dt;player.position.y+=velY*dt;if(player.position.y<=0){player.position.y=0;velY=0;grounded=true}body.rotation.z=Math.sin(time*3)*.015;coins.forEach((c,i)=>{if(!c.userData.active)return;c.rotation.y+=dt*2;c.position.y=c.userData.base+Math.sin(time*3+i)*.14;const dx=player.position.x-c.position.x,dz=player.position.z-c.position.z;if(dx*dx+dz*dz<1.8){c.visible=false;c.userData.active=false;score++;document.getElementById('score').textContent=score;showToast(score===20?'🏆 Все монеты собраны!':'+1 монета ✨')}})}const back=6.8,height=3.3;const cx=player.position.x-Math.sin(yaw)*back*Math.cos(pitch),cz=player.position.z-Math.cos(yaw)*back*Math.cos(pitch),cy=player.position.y+2.5+Math.sin(pitch)*back;camera.position.lerp(new THREE.Vector3(cx,cy,cz),Math.min(1,dt*8));lookAt.set(player.position.x,player.position.y+1.45,player.position.z);camera.lookAt(lookAt);renderer.render(scene,camera)}frame();function resizeGame(){const w=document.documentElement.clientWidth,h=window.visualViewport?.height||innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);document.documentElement.style.setProperty('--screen-h',h+'px')}addEventListener('resize',resizeGame);window.visualViewport?.addEventListener('resize',resizeGame);resizeGame();document.addEventListener('gesturestart',e=>e.preventDefault());
</script></body></html>
