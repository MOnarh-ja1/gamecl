<body><div id="ui"><div id="top"><div class="pill">SAFE SHOP · 3D</div><div class="pill">💵 <span id="money">0</span></div></div><div id="hint">Левый джойстик — идти · Справа проводи — смотреть</div><div id="inventory">Рюкзак: <span id="bag">пусто</span></div><div id="joystick"><div id="stick"></div></div><button id="action" disabled>ПОДОЙДИ</button><div id="toast"></div></div>

<div id="cover"><div id="panel"><h1>SAFE SHOP 3D</h1><p>Подойди к сейфу на столе, забери предмет и отнеси его скупщику. Содержимое сейфа обновляется каждые 4 секунды.</p><p>🕹 Двигайся слева · 📷 Осматривайся справа</p><button id="play" disabled>ИГРАТЬ</button><div id="load">Загрузка 3D…</div></div></div>
<script type="module">

const scene=new THREE.Scene();scene.background=new THREE.Color('#9dc6df');scene.fog=new THREE.Fog('#9dc6df',45,90);const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,140);

const material=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const ground=material('#86a56f'),wood=material('#805a37'),woodLight=material('#b78755'),metal=material('#555d68'),silver=material('#b2bbc0'),shirt=material('#ebeef3'),skin=material('#d9a67e'),pants=material('#324662'),shoe=material('#222934'),hair=material('#4b3328');
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),ground);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const pad=new THREE.Mesh(new THREE.PlaneGeometry(19,15),material('#b3a58d'));pad.rotation.x=-Math.PI/2;pad.position.y=.015;pad.receiveShadow=true;scene.add(pad);
// Single table and the safe on top
box(3,.24,1.8,woodLight,0,1.15,-5);for(const x of [-1.25,1.25])for(const z of [-5.7,-4.3])box(.19,1.12,.19,wood,x,.57,z);

// Buyer kiosk with counter and NPC

const sign=document.createElement('canvas');sign.width=512;sign.height=128;const ctx=sign.getContext('2d');ctx.fillStyle='#263c32';ctx.fillRect(0,0,512,128);ctx.fillStyle='#e6f5dd';ctx.font='bold 49px Arial';ctx.textAlign='center';ctx.fillText('СКУПЩИК',256,80);const spriteMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sign)});const board=new THREE.Mesh(new THREE.PlaneGeometry(3.1,.8),spriteMat);board.position.set(6,3.05,-4.21);scene.add(board);

const player=new THREE.Group();scene.add(player);player.position.set(0,0,4);box(.79,1,.4,shirt,0,1.52,0,player);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,16,12),skin);head.position.y=2.36;player.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.316,16,10,0,Math.PI*2,0,Math.PI*.44),hair);cap.position.y=2.40;player.add(cap);for(const x of [-.12,.12]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.027,8,8),material('#27303a'));eye.position.set(x,2.37,.295);player.add(eye)}

const joy=document.getElementById('joystick'),stick=document.getElementById('stick'),act=document.getElementById('action');let move={x:0,y:0},joyId=null,camId=null,camX=0,camY=0,yaw=0,pitch=.18,playing=false,walking=0;
function stickMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.30,mag=Math.hypot(dx,dy);if(mag>max){dx*=max/mag;dy*=max/mag}move.x=dx/max;move.y=-dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)'}

renderer.domElement.addEventListener('pointerdown',e=>{if(camId===null){camId=e.pointerId;camX=e.clientX;camY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(camId!==e.pointerId)return;yaw-=(e.clientX-camX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-camY)*.003,-.2,.7);camX=e.clientX;camY=e.clientY});for(const name of ['pointerup','pointercancel'])renderer.domElement.addEventListener(name,e=>{if(e.pointerId===camId)camId=null});
const keys=new Set();document.addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyE')act.click()});document.addEventListener('keyup',e=>keys.delete(e.code));
const lootTable=[['⌚','Часы',210],['💍','Кольцо',450],['📱','Телефон',320],['🏆','Кубок',580],['💎','Кристалл',800],['📷','Фотоаппарат',390],['🪙','Старинная монета',260]];
let loot=lootTable[0],nextRefresh=performance.now()+4000,money=0,bag=[],safeOpen=false,lootTaken=false,toastTimer,near='';
function updateBag(){document.getElementById('bag').textContent=bag.length?bag.length+' шт. · '+bag.reduce((s,x)=>s+x[2],0)+' ₽':'пусто'}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1500)}
function refreshLoot(){loot=lootTable[Math.floor(Math.random()*lootTable.length)];lootTaken=false;nextRefresh=performance.now()+4000;renderLoot()}
function renderLoot(){document.getElementById('lootIcon').textContent=lootTaken?'✅':loot[0];document.getElementById('lootName').textContent=lootTaken?'Сейф пуст до обновления':loot[1];document.getElementById('lootValue').textContent=lootTaken?'':loot[2]+' ₽';document.getElementById('take').disabled=lootTaken}
function safeToggle(open){safeOpen=open;document.getElementById('safePanel').style.display=open?'block':'none';if(open)renderLoot()}
document.getElementById('closeSafe').onclick=()=>safeToggle(false);document.getElementById('take').onclick=()=>{if(lootTaken)return;bag.push([...loot]);lootTaken=true;updateBag();renderLoot();showToast('Предмет в рюкзаке!');safeToggle(false)};
act.onclick=()=>{if(!playing||safeOpen)return;if(near==='safe'){safeToggle(true)}else if(near==='buyer'){if(!bag.length){showToast('Сначала возьми предмет из сейфа')}else{const total=bag.reduce((s,x)=>s+x[2],0);money+=total;bag=[];document.getElementById('money').textContent=money;updateBag();showToast('Продано за '+total+' ₽')}}};
document.getElementById('play').disabled=false;document.getElementById('load').textContent='Мир готов';document.getElementById('play').onclick=()=>{playing=true;document.getElementById('cover').style.display='none';document.documentElement.requestFullscreen?.().catch(()=>{})};refreshLoot();
const clock=new THREE.Clock(),look=new THREE.Vector3(),camGoal=new THREE.Vector3();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),now=performance.now();if(now>=nextRefresh){refreshLoot();if(playing)showToast('Сейф обновлён!')}
document.getElementById('countdown').textContent='Обновление через '+Math.max(0,Math.ceil((nextRefresh-now)/1000))+' сек.';
if(playing&&!safeOpen){let x=move.x,z=move.y;if(keys.has('KeyW')||keys.has('ArrowUp'))z+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))z-=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))x-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))x+=1;const m=Math.hypot(x,z);if(m>.12){x/=Math.max(1,m);z/=Math.max(1,m);const speed=4.3*dt,dx=(x*Math.cos(yaw)+z*Math.sin(yaw))*speed,dz=(-x*Math.sin(yaw)+z*Math.cos(yaw))*speed;const nx=THREE.MathUtils.clamp(player.position.x+dx,-9,9),nz=THREE.MathUtils.clamp(player.position.z+dz,-7,7);const blockTable=Math.abs(nx)<1.8&&nz>-6.2&&nz<-3.75;const blockKiosk=nx>3.9&&nx<8.1&&nz>-5.7&&nz<-4.1;if(!blockTable&&!blockKiosk){player.position.x=nx;player.position.z=nz}walking+=dt*10}const a=m>.12?Math.sin(walking)*.55:0;limbs.ll.rotation.x=THREE.MathUtils.lerp(limbs.ll.rotation.x,a,dt*12);limbs.rl.rotation.x=THREE.MathUtils.lerp(limbs.rl.rotation.x,-a,dt*12);limbs.la.rotation.x=THREE.MathUtils.lerp(limbs.la.rotation.x,-a,dt*12);limbs.ra.rotation.x=THREE.MathUtils.lerp(limbs.ra.rotation.x,a,dt*12)}
// Character always faces the exact horizontal camera direction.

const ds=Math.hypot(player.position.x,player.position.z+5),db=Math.hypot(player.position.x-6,player.position.z+5);near=ds<3.7?'safe':db<3.1?'buyer':'';act.disabled=!near||safeOpen;act.textContent=near==='safe'?'ОТКРЫТЬ СЕЙФ':near==='buyer'?'ПРОДАТЬ':'ПОДОЙДИ';
