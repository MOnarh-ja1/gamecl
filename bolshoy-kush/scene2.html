<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#44206f">
<title>Большой куш — День назад (исправленная сцена)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241349;color:white;font-family:system-ui,-apple-system,Arial,sans-serif;touch-action:manipulation;user-select:none}
button{font:inherit;cursor:pointer}
.scene{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.hide{display:none!important}
#menu{background:radial-gradient(ellipse at 75% 20%,#d869ab 0%,transparent 42%),radial-gradient(ellipse at 15% 90%,#7556e2 0%,transparent 52%),linear-gradient(125deg,#28145b,#7040a8)}
#menu:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(#ffe49b12 0 6deg,transparent 6deg 24deg);animation:turn 40s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.menuPanel{z-index:1;position:relative;width:min(1000px,95vw);max-height:94dvh;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:12px;background:linear-gradient(130deg,#372166eb,#6040a6db);border:2px solid #ffffff60;border-radius:30px;padding:clamp(14px,4vw,43px);box-shadow:0 22px 70px #190b3d99}
.eyebrow{font-weight:1000;font-size:clamp(11px,1.6vw,17px);color:#ffdc8c;letter-spacing:2px}
.logo{font-weight:1000;font-size:clamp(44px,8vw,100px);letter-spacing:-.06em;line-height:.86;text-shadow:0 7px 0 #8b3e91,0 12px 15px #1f0b4799;transform:rotate(-3deg);margin:19px 0 25px;white-space:nowrap}
.logo b{color:#ffe076;text-shadow:0 7px 0 #bf6a61,0 12px 15px #1f0b4799}
.intro{color:#f4e4ff;font-size:clamp(12px,1.6vw,18px);line-height:1.5;margin:0 0 22px;max-width:410px}
.bigbutton{min-height:57px;width:min(320px,100%);display:flex;align-items:center;justify-content:center;gap:18px;border:3px solid #ffefae;border-radius:18px;color:#572f78;font-weight:1000;font-size:clamp(18px,2.5vw,27px);background:linear-gradient(#fff4a9,#ffc044);box-shadow:0 8px 0 #a55360,0 14px 18px #1b113e78;animation:bounce 1.7s ease-in-out infinite}
.bigbutton:active{animation:none;transform:translateY(6px);box-shadow:0 2px 0 #a55360}
@keyframes bounce{50%{transform:translateY(-4px);filter:brightness(1.09)}}
.smalltext{color:#dcc2ef;font-size:11px;letter-spacing:1px;margin-top:24px;font-weight:800}
.art{width:100%;max-height:68dvh;filter:drop-shadow(0 18px 18px #170b3f80);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
#vault{background:radial-gradient(ellipse at 50% 44%,#9667bd 0%,#4b2b7d 50%,#190f32 100%);perspective:1400px}
#vault:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(#fff4a315 0deg 5deg,transparent 5deg 22deg);animation:turn 45s linear infinite}
.vtitle{z-index:5;position:absolute;top:max(10px,env(safe-area-inset-top));font-weight:1000;letter-spacing:2px;font-size:clamp(14px,3vw,23px);color:#ffe7a4;text-shadow:0 3px 7px #10092d}
.safe{position:relative;width:min(93vw,145vh);height:min(84dvh,87vw);border:clamp(8px,2vw,18px) solid #282640;border-radius:clamp(18px,3vw,42px);background:linear-gradient(130deg,#b0c4dc,#647a9a 55%,#27334f);box-shadow:0 0 0 7px #dbb667,0 17px 55px #120b2d,inset 0 0 0 12px #405170;transform-style:preserve-3d}
.inside{position:absolute;inset:5%;border-radius:20px;border:8px solid #2c263d;background:radial-gradient(ellipse at 55% 60%,#b98735,#4b2c28 55%,#180f26 95%);display:flex;justify-content:center;align-items:center}
.gold{position:relative;display:flex;align-items:flex-end;gap:1.5vw}
.bar{width:min(14vw,130px);height:min(18vh,115px);background:linear-gradient(130deg,#fff3a0,#ffc42b 55%,#d7841b);border:4px solid #fff0aa;border-radius:12px;box-shadow:0 8px 0 #995219,inset -10px -10px 0 #d68f23}
.bar:nth-child(2){height:min(25vh,155px)}
.bar:after{content:"$";display:grid;place-items:center;height:100%;font-weight:1000;color:#ba7920;font-size:clamp(25px,6vw,60px)}
.door{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;border:clamp(5px,1.2vw,12px) solid #e3edf3;border-radius:clamp(11px,2vw,30px);background:linear-gradient(140deg,#eef8ff,#a3c8df 24%,#546e99 67%,#35405f);box-shadow:inset 0 0 0 12px #435c80,0 4px 18px #160d35;transform-origin:left center;transition:transform 1.4s cubic-bezier(.15,.6,.16,1)}
.door:before{content:"";position:absolute;inset:7%;border:4px solid #f5e7b08c;border-radius:18px}
.wheel{width:min(41vw,42vh);height:min(41vw,42vh);border-radius:50%;background:radial-gradient(circle,#fff7c7 0 10%,#c18e40 11% 24%,#394669 25% 32%,#efc873 33% 44%,#6a5781 45% 53%,#ffd97d 54% 59%,#37476c 60%);border:7px solid #ffe4a1;box-shadow:0 10px 25px #1b2044aa;position:relative;animation:glowWheel 1.7s ease-in-out infinite}
@keyframes glowWheel{50%{filter:brightness(1.25);transform:scale(1.05)}}
.wheel:before,.wheel:after{content:"";position:absolute;top:47%;left:10%;width:80%;height:6%;border-radius:15px;background:#fff3c1;box-shadow:0 2px 4px #553f53}
.wheel:after{transform:rotate(60deg)}
.wheel i{position:absolute;inset:0;display:grid;place-items:center;color:#76506b;font-size:clamp(25px,6vw,60px);font-style:normal;font-weight:1000;z-index:1}
.tapOverlay{position:absolute;inset:0;z-index:4;border:0;background:transparent;touch-action:manipulation}
.hint{position:absolute;z-index:5;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:100px;border:3px solid #fff2b3;background:linear-gradient(#ffed92,#ffac3e);color:#51296d;font-weight:1000;font-size:clamp(20px,4vw,35px);padding:10px 30px;white-space:nowrap;pointer-events:none;animation:pulseHint 1s ease-in-out infinite;box-shadow:0 8px 0 #98556a}
@keyframes pulseHint{50%{transform:translateX(-50%) translateY(-9px);filter:brightness(1.17)}}
#vault.open .door{transform:rotateY(-113deg);animation:none}
#vault.open .wheel{animation:none}
#vault.open .tapOverlay,#vault.open .hint{display:none}
.openLabel{display:none;position:absolute;z-index:6;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);flex-direction:column;align-items:center;gap:10px;white-space:nowrap}
.openLabel strong{font-size:clamp(18px,4vw,36px);color:#ffec9b;text-shadow:0 3px 7px #000}
#vault.open .openLabel{display:flex;animation:showUp 1s ease-out both}
@keyframes showUp{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.action{border:3px solid #fff2b3;border-radius:16px;padding:10px 22px;background:linear-gradient(#ffed92,#ffc343);color:#543474;font-weight:1000;font-size:clamp(14px,2vw,19px)}
@media(max-width:650px) and (orientation:portrait){.menuPanel{display:flex;flex-direction:column;text-align:center;justify-content:space-around;height:95dvh;gap:0}.logo{font-size:clamp(48px,12vw,78px);margin:12px 0}.intro{margin:8px 0 12px}.bigbutton{margin:0 auto}.art{max-height:43dvh}.smalltext{margin-top:13px}}
@media(max-height:440px){.menuPanel{padding:14px 24px}.logo{font-size:clamp(37px,12vh,68px);margin:11px 0}.intro{margin:8px 0 12px;font-size:12px}.bigbutton{min-height:45px}.smalltext{margin-top:12px}}

/* Sequence: spinning handle, opening door, tunnel pull, quiet desert */
#vault.spinning .wheel{animation:handleSpin 1.2s cubic-bezier(.22,.75,.32,1) forwards!important}
@keyframes handleSpin{0%{transform:rotate(0deg) scale(1)}25%{transform:rotate(45deg) scale(1.06)}65%{transform:rotate(230deg) scale(.98)}100%{transform:rotate(390deg) scale(1)}}
#vault.spinning .tapOverlay,#vault.spinning .hint{display:none}
#vault.swinging .door{transform:rotateY(-113deg)}
#vault.swinging .wheel{animation:none;transform:rotate(390deg)}
#vault.sucked .safe{animation:vanishSafe 1.5s cubic-bezier(.65,.05,.85,.4) forwards}
@keyframes vanishSafe{0%{transform:scale(1);filter:blur(0)}45%{transform:scale(1.35);filter:blur(1px)}100%{transform:scale(5);filter:blur(18px);opacity:0}}
#tunnel{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;overflow:hidden;background:radial-gradient(ellipse at center,transparent 0 11%,#fff2bb33 27%,#edc27e66 40%,#59429b 70%,#1b103f 100%);transform:scale(.2);transition:opacity .3s,transform 1.5s cubic-bezier(.2,.8,.7,1)}
#tunnel.active{opacity:1;transform:scale(12)}
#tunnel:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 12deg,#ffffffaa 0deg 1deg,transparent 1deg 17deg,#ffdf7c88 17deg 18deg,transparent 18deg 30deg);animation:turn 1.3s linear infinite;mask-image:radial-gradient(circle,transparent 0%,#000 34%,#000 70%);-webkit-mask-image:radial-gradient(circle,transparent 0%,#000 34%,#000 70%)}
#flash{position:fixed;inset:0;z-index:13;pointer-events:none;background:#fff7d7;opacity:0}
#flash.active{animation:flashToDesert .65s ease-out both}
@keyframes flashToDesert{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#desert{position:fixed;inset:0;z-index:10;background:#e9c28f}
#desert svg{display:block;width:100%;height:100%;object-fit:cover}
#desert .sunGlow{animation:sunBreath 7s ease-in-out infinite;transform-origin:75% 25%}
@keyframes sunBreath{50%{opacity:.65;transform:scale(1.08)}}
#desert .cloud{animation:drift 45s linear infinite alternate}
@keyframes drift{to{transform:translateX(120px)}}
#desert .heat{animation:heatShift 4s ease-in-out infinite alternate}
@keyframes heatShift{to{transform:translateY(-8px);opacity:.38}}


#desert,#city{position:fixed;inset:0;overflow:hidden}#city{z-index:10;background:#9ac9e7}#city>svg{width:100%;height:100%;display:block}
.storyPerson{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);width:min(43vw,330px);height:min(86vh,510px);filter:drop-shadow(0 10px 9px #41313965);animation:rise 1s ease-out both}
.storyPerson svg{width:100%;height:100%;overflow:visible}
@keyframes rise{from{opacity:0;transform:translate(-50%,36px)}to{opacity:1;transform:translate(-50%,0)}}
.storyPerson .scratch{transform-box:fill-box;transform-origin:20% 85%;animation:scratchHead .8s ease-in-out infinite alternate}
@keyframes scratchHead{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.storyPerson .head{transform-box:fill-box;transform-origin:50% 85%;animation:confused 3.4s ease-in-out infinite alternate}
@keyframes confused{to{transform:rotate(8deg)}}
.storyBubble{position:absolute;top:7%;left:50%;transform:translateX(-50%);z-index:3;width:max-content;max-width:92vw;padding:13px 24px;border-radius:22px;background:#fff4dc;border:3px solid #7c5c80;color:#423153;text-align:center;font-weight:900;font-size:clamp(16px,3vw,29px);box-shadow:0 7px 0 #43355f55;opacity:0;pointer-events:none}
.storyBubble.show{animation:bubbleIn .4s forwards}.storyBubble.leave{animation:bubbleOut .4s forwards}
@keyframes bubbleIn{from{opacity:0;transform:translate(-50%,18px) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bubbleOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-18px)}}
#storyFade{position:fixed;inset:0;z-index:15;pointer-events:none;background:#0e1325;opacity:0;transition:opacity 1.2s ease}#storyFade.on{opacity:1}
#city .duo{position:absolute;bottom:-5%;left:50%;width:min(75vw,680px);height:min(86vh,540px);transform:translateX(-50%);display:flex;align-items:end;justify-content:space-around}
#city .duo svg{height:100%;width:42%}
#city .captionCity{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);padding:10px 22px;border:2px solid #ffffff9c;border-radius:16px;background:#2b446f;color:#fff4d8;font-weight:900;white-space:nowrap;font-size:clamp(15px,3vw,23px)}
@media(max-height:450px){.storyPerson{height:92vh;width:min(30vw,240px)}.storyBubble{top:3%;padding:9px 18px;font-size:16px}#city .duo{height:95vh;width:min(60vw,480px)}}

/* Day-before flashback: two arms on every character, both raise hands and part */
#dayBefore{position:fixed;inset:0;z-index:16;display:grid;place-items:center;pointer-events:none;color:#fff9eb;font-size:clamp(27px,6vw,70px);font-weight:1000;letter-spacing:.13em;text-align:center;text-shadow:0 4px 18px #000;opacity:0;transition:opacity .55s ease}
#dayBefore.show{opacity:1}
#city .duo svg{transition:transform 2.3s cubic-bezier(.4,0,.65,1),opacity 2s ease}
#city .duo .raiseLeft,#city .duo .raiseRight{transform-box:view-box;transition:transform 1s cubic-bezier(.18,.72,.25,1)}
#city .duo .raiseLeft{transform-origin:105px 212px}
#city .duo .raiseRight{transform-origin:195px 211px}
#city.celebrate .duo .raiseLeft{transform:rotate(125deg)}
#city.celebrate .duo .raiseRight{transform:rotate(-125deg)}
#city.separate .duo svg:first-child{transform:translateX(-75vw);opacity:0}
#city.separate .duo svg:nth-child(2){transform:translateX(75vw);opacity:0}

#city .duo .raiseLeft,#city .duo .raiseRight{transform-box:fill-box;transition:transform 1.25s cubic-bezier(.18,.75,.28,1)}
#city .duo .raiseLeft{transform-origin:50% 4%}
#city .duo .raiseRight{transform-origin:50% 4%}
#city.celebrate .duo .raiseLeft{transform:rotate(145deg)}
#city.celebrate .duo .raiseRight{transform:rotate(-145deg)}
#city .duo svg{transition:transform 3s ease-in-out,opacity 2.6s}
#city.separate .duo svg:first-child{transform:translateX(-110vw) rotate(-5deg);opacity:0}
#city.separate .duo svg:nth-child(2){transform:translateX(110vw) rotate(5deg);opacity:0}
#dayBefore{font-size:clamp(39px,8vw,105px);background:#0e1325;opacity:0}
#dayBefore.show{opacity:1}
#city .captionCity{background:#3d3263;font-size:clamp(14px,3vw,24px);padding:12px 25px}

/* Goodbye handshake: joined hands in the middle, never celebratory arms */
#city .duo{position:absolute}
#city .duo>.handshake{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:4;transform:none!important}
#city.handshakeNow .duo>.handshake{opacity:1;animation:handshakeAppear .5s ease-out both}
@keyframes handshakeAppear{from{opacity:0}to{opacity:1}}
#city .duo>.handshake .joint{transform-origin:340px 255px}
#city.handshakeNow .duo>.handshake .joint{animation:handShake 0.36s ease-in-out 4 alternate}
@keyframes handShake{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
#city.handshakeNow .duo>svg:first-child .raiseRight{opacity:1}
#city.handshakeNow .duo>svg:nth-child(2) .raiseLeft{opacity:1}
#city .duo>svg:first-child,#city .duo>svg:nth-child(2){transition:transform 2.4s ease-in-out,opacity 2.1s ease}
#city.separate .duo>.handshake{opacity:0}
#city.separate .duo>svg:first-child{transform:translateX(-100vw);opacity:0}
#city.separate .duo>svg:nth-child(2){transform:translateX(100vw);opacity:0}
#city.celebrate .duo .raiseLeft,#city.celebrate .duo .raiseRight{transform:none!important}
.storyPerson .scratch{transform-origin:188px 218px;transform-box:view-box;animation:scratchBehind .5s ease-in-out infinite alternate}
@keyframes scratchBehind{from{transform:rotate(-3deg)}to{transform:rotate(5deg)}}

/* New animated cut-scene: a different character watching television at home. */
#home{position:fixed;inset:0;z-index:10;background:#29354c;overflow:hidden}
#home>svg{height:100%;width:100%;display:block}
#home .tvScreen{animation:tvFlicker 1.8s infinite alternate}
@keyframes tvFlicker{from{fill:#47a8d1}to{fill:#69c5da}}
#home .watcher{transform-origin:650px 565px;animation:watchTV 3s ease-in-out infinite}
@keyframes watchTV{50%{transform:translateY(2px)}}
#home .stranger{transform:translateX(470px);opacity:0;transition:transform 2.1s ease-in,opacity .9s}
#home.enter .stranger{transform:translateX(0);opacity:1}
#home .couch{filter:drop-shadow(0 9px 11px #14172566)}
#home .tvLight{opacity:.22;animation:tvFlickerOpacity 2s linear infinite}
@keyframes tvFlickerOpacity{50%{opacity:.1}}
#home .homeShadow{position:absolute;inset:0;background:#10101b;opacity:0;pointer-events:none}
#home.blackout .homeShadow{animation:dramaticFade 1.2s ease-in forwards}
@keyframes dramaticFade{0%{opacity:0}35%{opacity:.65}100%{opacity:1}}
#home .homeTitle{position:absolute;top:max(15px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:14px;background:#17233cbf;border:1px solid #ffffff55;font-size:clamp(15px,3vw,22px);font-weight:900;color:#fff2d2;white-space:nowrap}
#home .endCard{position:absolute;inset:0;display:grid;place-items:center;color:#fff8e2;text-align:center;font-weight:900;letter-spacing:.06em;font-size:clamp(20px,4vw,39px);opacity:0;pointer-events:none;transition:opacity .8s}
#home.blackout .endCard{opacity:1;transition-delay:1s}
</style>
<script>
var vaultBusy=false;var storyTimers=[];function after(t,fn){storyTimers.push(setTimeout(fn,t))}function clearStory(){storyTimers.forEach(clearTimeout);storyTimers=[];document.getElementById('home').classList.add('hide');document.getElementById('home').classList.remove('enter','blackout');document.getElementById('city').classList.add('hide');document.getElementById('city').classList.remove('celebrate','handshakeNow','separate');document.getElementById('dayBefore').classList.remove('show');document.getElementById('storyFade').classList.remove('on');document.getElementById('bubble1').className='storyBubble';document.getElementById('bubble2').className='storyBubble';}
function startVault(){
 clearStory();
 document.getElementById('menu').classList.add('hide');
 var v=document.getElementById('vault');
 v.classList.remove('hide','open','spinning','swinging','sucked');
 document.getElementById('desert').classList.add('hide');
 document.getElementById('tunnel').classList.remove('active');
 document.getElementById('flash').classList.remove('active');
 vaultBusy=false;
}
function tapVault(){
 if(vaultBusy)return;
 vaultBusy=true;
 var v=document.getElementById('vault');
 v.classList.add('spinning');
 setTimeout(function(){v.classList.add('swinging');},1150);
 setTimeout(function(){v.classList.add('sucked');document.getElementById('tunnel').classList.add('active');},2800);
 setTimeout(function(){document.getElementById('flash').classList.add('active');},3900);
 after(4200,function(){document.getElementById('desert').classList.remove('hide');v.classList.add('hide');document.getElementById('tunnel').classList.remove('active');document.getElementById('flash').classList.remove('active');});
 after(5800,function(){document.getElementById('bubble1').classList.add('show')});
 after(8200,function(){document.getElementById('bubble1').classList.add('leave')});
 after(8700,function(){document.getElementById('bubble2').classList.add('show')});
 after(10900,function(){document.getElementById('bubble2').classList.add('leave')});
 after(11500,function(){document.getElementById('storyFade').classList.add('on')});
 after(11900,function(){document.getElementById('dayBefore').classList.add('show')});
 after(13400,function(){document.getElementById('desert').classList.add('hide');document.getElementById('city').classList.remove('hide')});
 after(14100,function(){document.getElementById('dayBefore').classList.remove('show')});
 after(14800,function(){document.getElementById('storyFade').classList.remove('on')});
 after(16000,function(){document.getElementById('city').classList.add('handshakeNow')});
 after(18500,function(){document.getElementById('city').classList.add('separate')});
 after(21500,function(){showHomeScene()});
}
function showCityDirect(){clearStory();document.getElementById('menu').classList.add('hide');document.getElementById('vault').classList.add('hide');document.getElementById('desert').classList.add('hide');document.getElementById('city').classList.remove('hide');document.getElementById('dayBefore').classList.add('show');after(1200,function(){document.getElementById('dayBefore').classList.remove('show')});after(1800,function(){document.getElementById('city').classList.add('handshakeNow')});after(4300,function(){document.getElementById('city').classList.add('separate')});after(7000,function(){showHomeScene()})}
function showHomeScene(){document.getElementById('city').classList.add('hide');document.getElementById('home').classList.remove('hide');after(1800,function(){document.getElementById('home').classList.add('enter')});after(5400,function(){document.getElementById('home').classList.add('blackout')})}
function resetVault(){startVault()}
function goMenu(){clearStory();document.getElementById('vault').classList.add('hide');document.getElementById('desert').classList.add('hide');document.getElementById('menu').classList.remove('hide');}
</script>
</head>
<body>
<main id="menu" class="scene">
 <div class="menuPanel">
  <div class="copy">
   <div class="eyebrow">★ ИГРА ПРО ОГРОМНЫЙ СЕЙФ ★</div>
   <div class="logo">БОЛЬШОЙ<br><b>КУШ!</b></div>
   <p class="intro">Перед тобой огромный сейф. Открой его одним нажатием и забери сокровища!</p>
   <button id="playBtn" class="bigbutton" type="button" onclick="startVault()">▶ ИГРАТЬ ➜</button>
   <div class="smalltext">● ПОЛНЫЙ ЭКРАН &nbsp; ● БЕЗ 3D &nbsp; ● СЦЕНА 2</div><button type="button" id="testScene" onclick="showCityDirect()" style="margin-top:12px;background:#ffffff20;border:1px solid #ffffff80;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800">ПОСМОТРЕТЬ «ДЕНЬ НАЗАД»</button>
  </div>
  <svg class="art" viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg" aria-label="Нарисованный банк и персонаж">
   <ellipse cx="260" cy="407" rx="215" ry="21" fill="#221045" opacity=".4"/>
   <path d="M74 172 262 54 454 172Z" fill="#ffdc7c" stroke="#53347e" stroke-width="11"/>
   <path d="M105 168 262 80 423 168Z" fill="#ffb773"/>
   <circle cx="262" cy="128" r="25" fill="#fff0ad" stroke="#61408d" stroke-width="7"/>
