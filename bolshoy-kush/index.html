<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1b123d;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif;touch-action:none;user-select:none}button{font-family:inherit;cursor:pointer;touch-action:manipulation}#game{width:100vw;height:100dvh;display:block}#menu,#ending,#paused{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 85% 12%,#f889a0 0,transparent 40%),radial-gradient(circle at 10% 82%,#6a49c7 0,transparent 50%),linear-gradient(128deg,#39237c,#834bbb);overflow:hidden} .hidden{display:none!important}

weight:800;margin-top:14px;min-height:46px}

@media(max-height:440px){.panel{padding:12px 26px}.logo{font-size:clamp(40px,11vh,66px);margin:9px 0}.copy p{font-size:11px;margin:8px 0 12px}.primary{min-height:43px;padding:6px 15px}.sub{margin-top:10px}#stick{width:98px;height:98px}#knob{width:43px;height:43px}#take{width:72px;height:72px;font-size:12px}}
@media(max-width:620px) and (orientation:portrait){.panel{display:flex;flex-direction:column;justify-content:space-around;text-align:center;padding:20px 17px;gap:2px}.logo{font-size:clamp(50px,13vw,80px);margin:13px 0}.copy p{margin:10px auto 15px}.primary{margin:auto;min-height:52px}.scene{height:45%;width:min(100%,420px)}.sub{margin-top:12px}}
</style></head>
<body><canvas id="game"></canvas>
<div id="menu"><div class="orb"></div><div class="panel"><div class="copy"><div class="small">★ ЯРКАЯ 2D-АРКАДА ★</div><div class="logo">БОЛЬШОЙ<br><strong>КУШ!</strong></div><p>Собирай деньги, открывай сейф и добегай до выхода. Только не попадись охранникам!</p><button id="playBtn" class="primary" type="button" onclick="window.startBigScore && window.startBigScore()"><span>▶</span> ИГРАТЬ <span>➜</span></button><div class="sub">● БЕЗ ИНТЕРНЕТА &nbsp; ● ДЛЯ ТЕЛЕФОНА</div></div>
<svg class="scene" viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff4ad"/><stop offset="1" stop-color="#ffad54"/></linearGradient><linearGradient id="coin" x2="0" y2="1"><stop stop-color="#fffbb1"/><stop offset="1" stop-color="#ffac22"/></linearGradient></defs><ellipse cx="260" cy="404" rx="220" ry="22" fill="#210f4c" opacity=".33"/><path d="M67 178 268 58 463 178Z" fill="#fff0ae" stroke="#50307b" stroke-width="11"/><path d="M103 174 267 83 426 174Z" fill="#ffb36c"/><circle cx="266" cy="136" r="26" fill="#ffe294" stroke="#5d3984" stroke-width="7"/><text x="266" y="147" fill="#7d4595" font-size="33" font-weight="900" text-anchor="middle">$</text><rect x="77" y="175" width="381" height="211" rx="13" fill="url(#gold)" stroke="#50317c" stroke-width="10"/><rect x="58" y="169" width="418" height="28" rx="9" fill="#7045a8" stroke="#50317c" stroke-width="7"/><g fill="#fff7d1" stroke="#58418c" stroke-width="7"><rect x="98" y="213" width="43" height="139" rx="5"/><rect x="159" y="213" width="43" height="139" rx="5"/><rect x="328" y="213" width="43" height="139" rx="5"/><rect x="392" y="213" width="43" height="139" rx="5"/></g><rect x="224" y="215" width="87" height="165" rx="9" fill="#69449b" stroke="#51317a" stroke-width="8"/><path d="M267 220v156" stroke="#4c2d76" stroke-width="6"/><g transform="translate(340 281) rotate(8)"><rect width="113" height="106" rx="14" fill="#4e3682" stroke="#352363" stroke-width="8"/><rect x="12" y="12" width="90" height="80" rx="9" fill="#9bd7ef" stroke="#37316e" stroke-width="7"/><circle cx="57" cy="52" r="27" fill="#e7f9ff" stroke="#51609a" stroke-width="7"/><path d="M57 29v46M34 52h46" stroke="#6479a8" stroke-width="7"/></g><g transform="translate(93 270)"><path d="M37 99 30 123h24l16-27m35 0 14 27h28l-19-33" fill="#3b2c62" stroke="#302154" stroke-width="7"/><rect x="25" y="38" width="110" height="69" rx="26" fill="#ffcc53" stroke="#513178" stroke-width="9"/><path d="M26 61 8 84m128-25 21 17" stroke="#513178" stroke-width="17" stroke-linecap="round"/><circle cx="84" cy="21" r="39" fill="#f9bf93" stroke="#503177" stroke-width="9"/><path d="M49 10Q44-19 85-19q42 0 40 29l-19-5-8-8q-25 12-49 13" fill="#47305f"/><rect x="55" y="11" width="25" height="15" rx="7" fill="#342b56"/><rect x="88" y="11" width="25" height="15" rx="7" fill="#342b56"/><path d="M81 18h8" stroke="#342b56" stroke-width="6"/><path d="M83 40q8 6 17-1" stroke="#9e5664" stroke-width="4" fill="none"/><rect x="124" y="53" width="59" height="57" rx="12" fill="#5ed4a3" stroke="#3c3979" stroke-width="7"/><path d="M136 72h34m-34 12h34" stroke="#ddffca" stroke-width="6"/></g><g fill="url(#coin)" stroke="#ffef8e" stroke-width="7"><circle cx="77" cy="116" r="26"/><circle cx="464" cy="116" r="32"/><circle cx="486" cy="377" r="19"/></g><g fill="#b77828" font-weight="1000" text-anchor="middle"><text x="77" y="127" font-size="32">$</text><text x="464" y="129" font-size="40">$</text><text x="486" y="386" font-size="23">$</text></g></svg></div></div>
<div id="hud"><div class="pill" id="cash">0 / 0</div><div class="pill" id="hearts">♥ ♥ ♥</div><div id="status">БАНК 1</div></div><button id="pauseBtn" type="button" aria-label="Пауза">Ⅱ</button><div id="controls"><div id="stick"><div id="knob"></div></div><button id="take" type="button">ВЗЯТЬ</button></div><div id="toast"></div>
<div id="paused" class="hidden"><div class="center"><h2>ПАУЗА</h2><p>Продолжить операцию?</p><button id="resume" class="primary" type="button">▶ ПРОДОЛЖИТЬ</button><button id="back" class="secondary" type="button">В МЕНЮ</button></div></div>
<div id="ending" class="hidden"><div class="center"><h2 id="endTitle">ПОБЕДА!</h2><p id="endText"></p><button id="again" class="primary" type="button">↻ ИГРАТЬ СНОВА</button><button id="endMenu" class="secondary" type="button">В МЕНЮ</button></div></div>
<script>
(function(){
'use strict';
const el=id=>document.getElementById(id),canvas=el('game'),ctx=canvas.getContext('2d');let width=0,height=0,scale=1,offsetX=0,offsetY=0,mode='menu',money=0,lives=3,level=1,inv=0,last=0,phase=0,toastTimeout=0;const world={w:900,h:540},player={x:92,y:267},safe={x:630,y:150,open:false},exit={x:838,y:272},keys={},axis={x:0,y:0};let notes=[],guards=[],pointer=null;
function visible(id,on){el(id).classList.toggle('hidden',!on)}
function gameUI(on){el('hud').classList.toggle('visible',on);el('pauseBtn').classList.toggle('visible',on);el('controls').classList.toggle('visible',on)}
function resize(){width=innerWidth;height=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(width*d));canvas.height=Math.max(1,Math.round(height*d));ctx.setTransform(d,0,0,d,0,0);scale=Math.min(width/900,height/540);offsetX=(width-900*scale)/2;offsetY=(height-540*scale)/2}addEventListener('resize',resize);resize();
function reset(){money=0;lives=3;inv=0;player.x=92;player.y=267;safe.open=false;notes=[{x:275,y:123,t:false},{x:340,y:377,t:false},{x:487,y:320,t:false},{x:715,y:414,t:false}];guards=[{x:461,y:230,p:1},{x:740,y:300,p:3.1}];axis.x=axis.y=0;hud()}
function hud(){el('cash').textContent='▣ '+money+' / 400';el('hearts').textContent='♥ '.repeat(lives);el('status').textContent='БАНК '+level}
function msg(t){el('toast').textContent=t;el('toast').style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{el('toast').style.display='none'},1500)}
function begin(){level=1;reset();mode='play';visible('menu',false);visible('ending',false);visible('paused',false);gameUI(true);msg('Собери 4 пачки и открой сейф!')}
function pause(){if(mode!=='play')return;mode='pause';visible('paused',true);gameUI(false)}
function resume(){if(mode!=='pause')return;mode='play';visible('paused',false);gameUI(true);last=performance.now()}
function menu(){mode='menu';gameUI(false);visible('menu',true);visible('ending',false);visible('paused',false);axis.x=axis.y=0}
function finish(win){mode='end';gameUI(false);visible('ending',true);el('endTitle').textContent=win?'КУШ СОРВАН!':'ТЕБЯ ПОЙМАЛИ';el('endText').textContent=win?'Ты собрал деньги и выбрался из банка!':'Обойди охранников и попробуй ещё раз.'}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function interact(){if(mode!=='play')return;if(dist(player,safe)<87&&!safe.open){safe.open=true;money+=100;hud();msg('СЕЙФ ОТКРЫТ! +100');return}if(dist(player,exit)<72){if(money>=500){finish(true)}else msg('Сначала собери все деньги и открой сейф!');return}msg('Подойди к сейфу или выходу')}
window.startBigScore=begin;el('playBtn').addEventListener('click',begin);el('pauseBtn').onclick=pause;el('resume').onclick=resume;el('back').onclick=menu;el('again').onclick=begin;el('endMenu').onclick=menu;el('take').onclick=interact;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e'||e.key===' ')interact();if(e.key==='Escape'){if(mode==='play')pause();else if(mode==='pause')resume()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=el('stick'),knob=el('knob');function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy)||1,limit=r.width*.31,k=Math.min(1,limit/m);axis.x=dx*k/limit;axis.y=dy*k/limit;knob.style.transform='translate(calc(-50% + '+dx*k+'px),calc(-50% + '+dy*k+'px))'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;try{stick.setPointerCapture(e.pointerId)}catch(_){}moveStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});function stop(e){if(pointer!==e.pointerId)return;pointer=null;axis.x=axis.y=0;knob.style.transform='translate(-50%,-50%)'}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
function rr(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function text(t,x,y,s=17,c='#fff'){ctx.textAlign='center';ctx.fillStyle=c;ctx.font='900 '+s+'px system-ui,Arial';ctx.fillText(t,x,y)}function pile(x,y){rr(x-24,y-13,48,26,'#19664f',5);rr(x-19,y-9,38,18,'#68eb93',3);circle(x,y,7,'#16875d');text('$',x,y+5,15,'#e5ffb6')}
function character(x,y,police){circle(x,y+14,18,'#0a0a2255');rr(x-14,y-11,28,34,police?'#347eb9':'#f5bd4f',8);circle(x,y-19,15,'#eebd9b');rr(x-14,y-33,28,11,police?'#263e69':'#4b2a60',4);rr(x-11,y-22,22,8,'#292b47',4);circle(x-5,y-19,2,'#fff');circle(x+5,y-19,2,'#fff')}
function paint(){ctx.fillStyle='#20173d';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);rr(0,0,900,540,'#261c4b');rr(25,25,850,490,'#43376b',18);for(let x=37;x<865;x+=46)for(let y=37;y<504;y+=46)rr(x,y,43,43,(x+y)%3<1?'#504277':'#4a3c70',4);
rr(100,66,245,72,'#674a9c',13);text('КАССЫ',223,111,27,'#fff1a6');rr(110,147,140,22,'#a58ad0',7);rr(298,411,260,58,'#6e5396',10);text('СТОЙКА',428,445,21,'#ffeea3');
rr(557,65,150,155,'#2d234e',16);rr(567,74,130,137,safe.open?'#395e67':'#a5a5c1',11);rr(577,85,111,116,safe.open?'#1d3544':'#58658c',8);circle(632,148,32,safe.open?'#2cb98b':'#eac779');circle(632,148,23,safe.open?'#173a51':'#627f9c');text(safe.open?'✓':'✣',632,157,30,'#fff5bf');text(safe.open?'ОТКРЫТО':'СЕЙФ',632,246,19,'#fff1b1');
rr(781,198,95,150,'#242446',10);rr(794,210,71,126,'#29c599',8);text('ВЫХОД',829,190,18,'#fff7ac');text('➜',829,286,35,'#165a51');
notes.forEach(n=>{if(!n.t)pile(n.x,n.y)});guards.forEach(g=>character(g.x,g.y,true));if(inv===0||Math.floor(phase*10)%2===0)character(player.x,player.y,false);
if(dist(player,safe)<87&&!safe.open){rr(player.x-60,player.y-70,120,27,'#6e31b5',8);text('ОТКРЫТЬ',player.x,player.y-51,14,'#fff')}ctx.restore()}
function update(dt){phase+=dt;let vx=axis.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=axis.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(vx,vy);if(len){player.x=Math.max(52,Math.min(847,player.x+vx/Math.max(1,len)*215*dt));player.y=Math.max(75,Math.min(479,player.y+vy/Math.max(1,len)*215*dt))}notes.forEach(n=>{if(!n.t&&dist(player,n)<35){n.t=true;money+=100;hud();msg('+100 МОНЕТ!')}});guards.forEach((g,i)=>{g.p+=dt*(.9+i*.2);g.x=(i===0?470:733)+Math.sin(g.p)*57;g.y=(i===0?266:315)+Math.cos(g.p*1.2)*88});inv=Math.max(0,inv-dt);if(inv===0&&guards.some(g=>dist(player,g)<33)){lives--;inv=1.6;player.x=92;player.y=267;hud();msg('ОСТОРОЖНО, ОХРАННИК!');if(lives<=0)finish(false)}if(dist(player,exit)<54&&money>=500)finish(true)}
function frame(now){let dt=Math.min(.045,Math.max(0,(now-(last||now))/1000));last=now;if(mode==='play')update(dt);paint();requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.__bigScoreTest={start:begin,state:()=>mode}; 
})();
</script></body></html>
