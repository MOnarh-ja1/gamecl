<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#44206f">
<title>Большой куш — Сейф</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241349;color:white;font-family:system-ui,-apple-system,Arial,sans-serif;touch-action:manipulation;user-select:none}
button{font:inherit;cursor:pointer}
.scene{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.hide{display:none!important}
#menu{background:radial-gradient(ellipse at 75% 20%,#d869ab 0%,transparent 42%),radial-gradient(ellipse at 15% 90%,#7556e2 0%,transparent 52%),linear-gradient(125deg,#28145b,#7040a8)}
#menu:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(#ffe49b12 0 6deg,transparent 6deg 24deg);animation:turn 40s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.menuPanel{z-index:1;position:relative;width:min(1000px,95vw);max-height:94dvh;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:12px;background:linear-gradient(130deg,#372166eb,#6040a6db);border:2px solid #ffffff60;border-radius:30px;padding:clamp(14px,4vw,43px);box-shadow:0 22px 70px #190b3d99}
.eyebrow{font-weight:1000;font-size:clamp(11px,1.6vw,17px);color:#ffdc8c;letter-spacing:2px}
.logo{font-weight:1000;font-size:clamp(44px,8vw,100px);letter-spacing:-.06em;line-height:.86;text-shadow:0 7px 0 #8b3e91,0 12px 15px #1f0b4799;transform:rotate(-3deg);margin:19px 0 25px;white-space:nowrap}
.logo b{color:#ffe076;text-shadow:0 7px 0 #bf6a61,0 12px 15px #1f0b4799}
.intro{color:#f4e4ff;font-size:clamp(12px,1.6vw,18px);line-height:1.5;margin:0 0 22px;max-width:410px}
.bigbutton{min-height:57px;width:min(320px,100%);display:flex;align-items:center;justify-content:center;gap:18px;border:3px solid #ffefae;border-radius:18px;color:#572f78;font-weight:1000;font-size:clamp(18px,2.5vw,27px);background:linear-gradient(#fff4a9,#ffc044);box-shadow:0 8px 0 #a55360,0 14px 18px #1b113e78;animation:bounce 1.7s ease-in-out infinite}
.bigbutton:active{animation:none;transform:translateY(6px);box-shadow:0 2px 0 #a55360}
@keyframes bounce{50%{transform:translateY(-4px);filter:brightness(1.09)}}
.smalltext{color:#dcc2ef;font-size:11px;letter-spacing:1px;margin-top:24px;font-weight:800}
.art{width:100%;max-height:68dvh;filter:drop-shadow(0 18px 18px #170b3f80);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
#vault{background:radial-gradient(ellipse at 50% 44%,#9667bd 0%,#4b2b7d 50%,#190f32 100%);perspective:1400px}
#vault:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(#fff4a315 0deg 5deg,transparent 5deg 22deg);animation:turn 45s linear infinite}
.vtitle{z-index:5;position:absolute;top:max(10px,env(safe-area-inset-top));font-weight:1000;letter-spacing:2px;font-size:clamp(14px,3vw,23px);color:#ffe7a4;text-shadow:0 3px 7px #10092d}
.safe{position:relative;width:min(93vw,145vh);height:min(84dvh,87vw);border:clamp(8px,2vw,18px) solid #282640;border-radius:clamp(18px,3vw,42px);background:linear-gradient(130deg,#b0c4dc,#647a9a 55%,#27334f);box-shadow:0 0 0 7px #dbb667,0 17px 55px #120b2d,inset 0 0 0 12px #405170;transform-style:preserve-3d}
.inside{position:absolute;inset:5%;border-radius:20px;border:8px solid #2c263d;background:radial-gradient(ellipse at 55% 60%,#b98735,#4b2c28 55%,#180f26 95%);display:flex;justify-content:center;align-items:center}
.gold{position:relative;display:flex;align-items:flex-end;gap:1.5vw}
.bar{width:min(14vw,130px);height:min(18vh,115px);background:linear-gradient(130deg,#fff3a0,#ffc42b 55%,#d7841b);border:4px solid #fff0aa;border-radius:12px;box-shadow:0 8px 0 #995219,inset -10px -10px 0 #d68f23}
.bar:nth-child(2){height:min(25vh,155px)}
.bar:after{content:"$";display:grid;place-items:center;height:100%;font-weight:1000;color:#ba7920;font-size:clamp(25px,6vw,60px)}
.door{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;border:clamp(5px,1.2vw,12px) solid #e3edf3;border-radius:clamp(11px,2vw,30px);background:linear-gradient(140deg,#eef8ff,#a3c8df 24%,#546e99 67%,#35405f);box-shadow:inset 0 0 0 12px #435c80,0 4px 18px #160d35;transform-origin:left center;transition:transform 1.4s cubic-bezier(.15,.6,.16,1)}
.door:before{content:"";position:absolute;inset:7%;border:4px solid #f5e7b08c;border-radius:18px}
.wheel{width:min(41vw,42vh);height:min(41vw,42vh);border-radius:50%;background:radial-gradient(circle,#fff7c7 0 10%,#c18e40 11% 24%,#394669 25% 32%,#efc873 33% 44%,#6a5781 45% 53%,#ffd97d 54% 59%,#37476c 60%);border:7px solid #ffe4a1;box-shadow:0 10px 25px #1b2044aa;position:relative;animation:glowWheel 1.7s ease-in-out infinite}
@keyframes glowWheel{50%{filter:brightness(1.25);transform:scale(1.05)}}
.wheel:before,.wheel:after{content:"";position:absolute;top:47%;left:10%;width:80%;height:6%;border-radius:15px;background:#fff3c1;box-shadow:0 2px 4px #553f53}
.wheel:after{transform:rotate(60deg)}
.wheel i{position:absolute;inset:0;display:grid;place-items:center;color:#76506b;font-size:clamp(25px,6vw,60px);font-style:normal;font-weight:1000;z-index:1}
.tapOverlay{position:absolute;inset:0;z-index:4;border:0;background:transparent;touch-action:manipulation}
.hint{position:absolute;z-index:5;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:100px;border:3px solid #fff2b3;background:linear-gradient(#ffed92,#ffac3e);color:#51296d;font-weight:1000;font-size:clamp(20px,4vw,35px);padding:10px 30px;white-space:nowrap;pointer-events:none;animation:pulseHint 1s ease-in-out infinite;box-shadow:0 8px 0 #98556a}
@keyframes pulseHint{50%{transform:translateX(-50%) translateY(-9px);filter:brightness(1.17)}}
#vault.open .door{transform:rotateY(-113deg);animation:none}
#vault.open .wheel{animation:none}
#vault.open .tapOverlay,#vault.open .hint{display:none}
.openLabel{display:none;position:absolute;z-index:6;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);flex-direction:column;align-items:center;gap:10px;white-space:nowrap}
.openLabel strong{font-size:clamp(18px,4vw,36px);color:#ffec9b;text-shadow:0 3px 7px #000}
#vault.open .openLabel{display:flex;animation:showUp 1s ease-out both}
@keyframes showUp{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.action{border:3px solid #fff2b3;border-radius:16px;padding:10px 22px;background:linear-gradient(#ffed92,#ffc343);color:#543474;font-weight:1000;font-size:clamp(14px,2vw,19px)}
@media(max-width:650px) and (orientation:portrait){.menuPanel{display:flex;flex-direction:column;text-align:center;justify-content:space-around;height:95dvh;gap:0}.logo{font-size:clamp(48px,12vw,78px);margin:12px 0}.intro{margin:8px 0 12px}.bigbutton{margin:0 auto}.art{max-height:43dvh}.smalltext{margin-top:13px}}
@media(max-height:440px){.menuPanel{padding:14px 24px}.logo{font-size:clamp(37px,12vh,68px);margin:11px 0}.intro{margin:8px 0 12px;font-size:12px}.bigbutton{min-height:45px}.smalltext{margin-top:12px}}
</style>
<script>
function startVault(){document.getElementById('menu').classList.add('hide');var v=document.getElementById('vault');v.classList.remove('hide','open');}
function tapVault(){var v=document.getElementById('vault');if(v.classList.contains('open'))return;v.classList.add('open');}
function resetVault(){var v=document.getElementById('vault');v.classList.remove('open');void v.offsetWidth;}
function goMenu(){document.getElementById('vault').classList.add('hide');document.getElementById('menu').classList.remove('hide');}
</script>
</head>
<body>
<main id="menu" class="scene">
 <div class="menuPanel">
  <div class="copy">
   <div class="eyebrow">★ ИГРА ПРО ОГРОМНЫЙ СЕЙФ ★</div>
   <div class="logo">БОЛЬШОЙ<br><b>КУШ!</b></div>
   <p class="intro">Перед тобой огромный сейф. Открой его одним нажатием и забери сокровища!</p>
   <button id="playBtn" class="bigbutton" type="button" onclick="startVault()">▶ ИГРАТЬ ➜</button>
   <div class="smalltext">● ПОЛНЫЙ ЭКРАН &nbsp; ● БЕЗ 3D</div>
  </div>
  <svg class="art" viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg" aria-label="Нарисованный банк и персонаж">
   <ellipse cx="260" cy="407" rx="215" ry="21" fill="#221045" opacity=".4"/>
   <path d="M74 172 262 54 454 172Z" fill="#ffdc7c" stroke="#53347e" stroke-width="11"/>
   <path d="M105 168 262 80 423 168Z" fill="#ffb773"/>
   <circle cx="262" cy="128" r="25" fill="#fff0ad" stroke="#61408d" stroke-width="7"/>
   <text x="262" y="142" font-family="Arial" font-size="37" font-weight="900" fill="#67418c" text-anchor="middle">$</text>
   <rect x="79" y="175" width="377" height="212" rx="12" fill="#ffc97e" stroke="#543180" stroke-width="11"/>
   <rect x="58" y="171" width="416" height="27" rx="9" fill="#8152bd" stroke="#50337f" stroke-width="7"/>
   <g fill="#fff4d2" stroke="#63478f" stroke-width="7">
   <rect x="100" y="210" width="44" height="145" rx="6"/><rect x="161" y="210" width="44" height="145" rx="6"/><rect x="326" y="210" width="44" height="145" rx="6"/><rect x="388" y="210" width="44" height="145" rx="6"/></g>
   <rect x="221" y="219" width="86" height="166" rx="10" fill="#694b9b" stroke="#563580" stroke-width="8"/>
   <g transform="translate(331 271)"><rect width="118" height="112" rx="15" fill="#4a386e" stroke="#2f215b" stroke-width="9"/><rect x="14" y="14" width="89" height="84" rx="9" fill="#9fc4d7" stroke="#394775" stroke-width="7"/><circle cx="58" cy="55" r="28" fill="#e8faff" stroke="#50668e" stroke-width="6"/><path d="M58 32v46M35 55h46" stroke="#566da0" stroke-width="7"/></g>
   <g transform="translate(78 268)">
   <path d="M33 93 25 121h26l16-27m38 0 14 27h28l-19-28" fill="#443368" stroke="#302254" stroke-width="7"/>
   <rect x="25" y="31" width="116" height="74" rx="26" fill="#f4bc44" stroke="#53347a" stroke-width="9"/>
   <path d="M23 56 5 79m137-19 18 19" stroke="#53347a" stroke-width="17" stroke-linecap="round"/>
   <circle cx="84" cy="12" r="39" fill="#efb88f" stroke="#503278" stroke-width="9"/>
   <path d="M48 6q-8-41 37-41 44 0 40 42l-23-6-10-8q-21 13-44 13" fill="#38284e"/>
   <rect x="55" y="6" width="60" height="20" rx="9" fill="#332543"/>
   <circle cx="70" cy="15" r="3" fill="white"/><circle cx="101" cy="15" r="3" fill="white"/>
   <path d="M82 40q10 7 18-1" fill="none" stroke="#ae5563" stroke-width="4"/>
   <rect x="130" y="52" width="63" height="58" rx="12" fill="#63dea3" stroke="#393875" stroke-width="7"/>
   <path d="M142 69h39m-39 14h39" stroke="#dcffbb" stroke-width="7"/></g>
   <g fill="#ffca38" stroke="#ffef97" stroke-width="7"><circle cx="74" cy="111" r="29"/><circle cx="463" cy="103" r="34"/><circle cx="481" cy="380" r="22"/></g>
   <g fill="#b77327" font-family="Arial" font-weight="900" text-anchor="middle"><text x="74" y="122" font-size="35">$</text><text x="463" y="116" font-size="43">$</text><text x="481" y="389" font-size="26">$</text></g>
  </svg>
 </div>
</main>
<section id="vault" class="scene hide" aria-label="Огромный сейф">
 <div class="vtitle">БОЛЬШОЙ КУШ • СЕЙФ</div>
 <div class="safe">
  <div class="inside"><div class="gold"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>
  <div class="door"><div class="wheel"><i>★</i></div></div>
 </div>
 <button class="tapOverlay" type="button" aria-label="Нажми, чтобы открыть сейф" onclick="tapVault()"></button>
 <div class="hint">НАЖМИ</div>
 <div class="openLabel"><strong>СЕЙФ ОТКРЫТ!</strong><button class="action" type="button" onclick="resetVault()">↻ ОТКРЫТЬ ЕЩЁ РАЗ</button><button class="action" type="button" onclick="goMenu()">⌂ В МЕНЮ</button></div>
</section>
</body></html>
