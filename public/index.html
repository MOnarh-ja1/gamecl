<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEEL VANGUARD — M-Game</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#12141c;--pn:#1b1f2b;--ln:#2d3446;--tx:#e8eaf0;--mu:#8b93a7;--gd:#f2b84b;--r0:#4b69ff;--r1:#8847ff;--r2:#d32ee6;--r3:#eb4b4b;--r4:#ffd700}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Golos Text",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.ru{font-family:"Russo One","Arial Black",sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:9px 16px;transition:transform .12s,border-color .15s}
button:hover:not(:disabled){border-color:var(--gd);transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:default}
button.go{background:var(--gd);color:#241800;border-color:var(--gd);font-weight:600}
button:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
nav{display:flex;gap:8px}
nav button.on{border-color:var(--gd);color:var(--gd)}
.bal{display:flex;gap:10px;align-items:center}
.bal b{font-family:"Russo One",sans-serif;font-weight:400;color:var(--gd);font-size:20px}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.case{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.case:hover{transform:translateY(-4px) rotate(-.6deg);border-color:var(--h)}
.box{height:96px;margin:4px auto 10px;width:96px;border-radius:10px;background:linear-gradient(145deg,var(--h),#0b0d13);display:grid;place-items:center;font-size:44px;box-shadow:0 8px 24px -8px var(--h);position:relative}
.box:after{content:"";position:absolute;left:0;right:0;top:44%;height:8px;background:rgba(0,0,0,.35)}
.case small{color:var(--gd)}
.it{background:var(--pn);border:1px solid var(--ln);border-bottom:3px solid var(--c);border-radius:8px;padding:10px;text-align:center;position:relative;overflow:hidden}
.it .ic{height:64px;display:grid;place-items:center;font-size:34px;border-radius:6px;margin-bottom:6px;background:radial-gradient(circle at 50% 60%,var(--a),var(--b))}
.it .n{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;justify-content:center;margin-top:8px}
.row button{padding:5px 9px;font-size:12px}
#open{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.roll{position:relative;overflow:hidden;background:#0d0f15;border:1px solid var(--ln);border-radius:12px;height:150px;margin-bottom:14px}
.roll:before,.roll:after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none}
.roll:before{left:0;background:linear-gradient(90deg,#0d0f15,transparent)}
.roll:after{right:0;background:linear-gradient(270deg,#0d0f15,transparent)}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gd);z-index:3;box-shadow:0 0 14px var(--gd)}
.strip{display:flex;gap:8px;padding:10px 0;position:absolute;left:0;top:0;will-change:transform}
.strip .it{width:150px;flex:none;height:130px}
.ctl{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(6,8,12,.86);display:none;place-items:center;z-index:50;padding:16px}
.ov.on{display:grid}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:22px;width:min(520px,100%);text-align:center}
.win{--g:#fff;animation:pop .6s cubic-bezier(.2,1.4,.3,1) both;box-shadow:0 0 0 1px var(--g),0 0 70px -10px var(--g)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,var(--g) 0 6deg,transparent 6deg 24deg);opacity:.12;animation:spin 12s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bigic{font-size:84px;line-height:1.1;margin:6px 0;position:relative}
#cv{width:100%;height:min(52vh,380px);display:block;border-radius:10px;background:radial-gradient(circle at 50% 45%,#262c3d,#0d0f15);touch-action:none;cursor:grab;margin:12px 0 8px}
.mu{color:var(--mu);font-size:13px}
h2{font-size:20px;margin-bottom:12px}
.inv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.win,.rays{animation:none}}
header{background:rgba(14,16,23,.72);backdrop-filter:blur(14px)}
button{border-radius:10px;background:linear-gradient(180deg,#252b3b,#1b1f2b)}
button.go{background:linear-gradient(180deg,#ffd27a,#f2b84b)}
.ov{backdrop-filter:blur(6px)}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 700px at 12% -10%,#1e2742,transparent 60%),radial-gradient(900px 600px at 100% 110%,#2b1b3d,transparent 60%),#0d0f16}
#bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%)}
#bg i{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.26;animation:drift 22s ease-in-out infinite alternate}
#bg i:nth-child(1){background:#4b69ff;left:-80px;top:10%}#bg i:nth-child(2){background:#d32ee6;right:-100px;top:45%;animation-delay:-8s}#bg i:nth-child(3){background:#ffd700;left:40%;bottom:-220px;opacity:.13;animation-delay:-14s}
@keyframes drift{to{transform:translate(120px,-90px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){#bg i{animation:none}}
.case{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--pn)}
.it .ic{font-size:30px;text-shadow:0 2px 6px #000}
.crate{position:relative;width:108px;height:90px;margin:4px auto 10px;border-radius:10px;background:linear-gradient(160deg,var(--h),#0b0d13 150%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35),0 10px 26px -10px var(--h);display:grid;place-items:center}
.crate:before,.crate:after{content:"";position:absolute;top:0;bottom:0;width:10px;background:rgba(0,0,0,.32)}
.crate:before{left:12px}.crate:after{right:12px}
.em{width:60px;height:60px;fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.4;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.6));position:relative;z-index:1}
.mini{display:inline-block;vertical-align:middle}.mini .em{width:30px;height:30px;stroke:var(--gd)}
.upg{display:grid;grid-template-columns:1fr 260px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.upg{grid-template-columns:1fr}}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));max-height:460px;overflow:auto;padding:4px}
.it.sel{outline:2px solid var(--gd);transform:translateY(-2px)}
.sub{font-size:15px;margin-bottom:8px}
.dial{position:relative;width:230px;height:230px;border-radius:50%;background:conic-gradient(#3ddc84 0 var(--p,0deg),#3a2230 var(--p,0deg) 360deg);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 0 40px -12px #3ddc84}
.dial:before{content:"";position:absolute;inset:16px;border-radius:50%;background:#0f121a}
.ptr{position:absolute;left:50%;top:0;width:4px;height:50%;margin-left:-2px;transform-origin:50% 100%;z-index:2}
.ptr:before{content:"";position:absolute;top:-4px;left:-5px;width:14px;height:34px;border-radius:7px;background:var(--gd);box-shadow:0 0 12px var(--gd)}
.dc{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column}.dc b{font:400 32px "Russo One",sans-serif;color:var(--gd)}
.mid{text-align:center}
.menu{display:grid;gap:12px}.menu .em{width:88px;height:88px;stroke:var(--gd);margin:0 auto;display:block}
.menu textarea{width:100%;background:#0d0f15;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px monospace;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat div{background:#0d0f15;border:1px solid var(--ln);border-radius:10px;padding:8px}.stat b{display:block;font:400 18px "Russo One",sans-serif;color:var(--gd)}.stat span{font-size:12px;color:var(--mu)}
details summary{cursor:pointer;color:var(--mu)}
</style>
</head>
<body>
<header>
  <h1 class="ru">STEEL VANGUARD</h1>
  <nav><button id="t1" class="on">Кейсы</button><button id="t2">Инвентарь (<span id="cnt">0</span>)</button></nav>
  <div class="bal"><b id="bal"></b></div>
</header>
<main>
  <section id="shop"><div class="grid" id="cases"></div></section>
  <section id="open">
    <div class="top"><button id="back">Назад к кейсам</button><h2 id="ctitle"></h2><span class="mu" id="cstat"></span></div>
    <div class="roll"><div class="mark"></div><div class="strip" id="strip"></div></div>
    <div class="ctl"><button class="go" id="btnOpen">Открыть</button><button id="btnFast">Быстрое открытие: выкл</button></div>
    <h2>Что внутри</h2>
    <div class="grid" id="contents"></div>
  </section>
  <section id="invsec" style="display:none">
    <div class="inv-top"><h2>Инвентарь</h2><div><span class="mu" id="invval"></span> <button id="sellAll">Продать всё, кроме редких</button></div></div>
    <div class="grid" id="inv"></div>
  </section>
</main>

<div class="ov" id="reveal"><div class="card win" id="rcard" style="position:relative;overflow:hidden">
  <div class="rays"></div>
  <div class="mu" id="rrar" style="position:relative"></div>
  <div class="bigic" id="ric"></div>
  <h2 id="rname" style="position:relative"></h2>
  <p class="mu" id="rinfo" style="position:relative"></p>
  <div class="ctl" style="position:relative;margin:0"><button id="rinspect">Осмотреть</button><button id="rsell">Продать</button><button class="go" id="rok">Забрать</button></div>
</div></div>

<div class="ov" id="insp"><div class="card" style="width:min(640px,100%)">
  <h2 id="iname"></h2>
  <div class="mu" id="iinfo"></div>
  <canvas id="cv"></canvas>
  <div class="mu">Тяни, чтобы вращать. Колёсико или щипок меняет масштаб.</div>
  <div class="ctl" style="margin:12px 0 0"><button class="go" id="iclose">Закрыть</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const RC=['#4b69ff','#8847ff','#d32ee6','#eb4b4b','#ffd700'];
const RL=['Армейское','Запрещённое','Засекреченное','Тайное','Редкий предмет'];
const RW=[79.92,15.98,3.2,.64,.26];
const PM=[.3,1,3.5,15,90];
const GL={pistol:'🔫',smg:'🔫',rifle:'🔫',knife:'🗡️',karambit:'🔪'};
const WP={pistol:['Desert Eagle','USP-S','Glock-18','P250'],smg:['MP9','P90','MAC-10','UMP-45','MP5'],rifle:['AK-47','M4A4','AWP','SG 553'],knife:['Штык-нож','Складной нож','Охотничий нож','Нож-бабочка','Боуи','Танто'],karambit:['Керамбит']};
const SK=[['Красная линия','#c0392b','#2a0d0b'],['Неон','#00e5ff','#0a2a33'],['Азимов','#f2f2f2','#ff7a00'],['Дракон','#16a34a','#052e16'],['Гипер','#a855f7','#1e1b4b'],['Золотая лихорадка','#e6b422','#3b2a05'],['Иней','#9ad4ff','#173247'],['Пламя','#ff6a00','#4a1500'],['Карбон','#4b5563','#14171c'],['Токсин','#b6ff00','#1f2a00'],['Роза','#ff5fa2','#3a0a1f'],['Океан','#1e6bff','#06143a']];
const CS=[['Старт',2,'#4b69ff'],['Неоновый',5,'#00c2e0'],['Огненный',10,'#ff6a00'],['Ледяной',15,'#7cc7ff'],['Токсичный',25,'#8fd400'],['Золотой',50,'#e6b422'],['Космос',100,'#a855f7'],['Легенда',250,'#eb4b4b']];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cases=CS.map((c,i)=>{const R=rng(i*97+13),items=[];[5,3,2,1,1].forEach((n,r)=>{for(let k=0;k<n;k++){const ty=r==4?(R()<.4?'karambit':'knife'):['pistol','smg','rifle'][R()*3|0];const nm=WP[ty][R()*WP[ty].length|0];const sk=SK[(i*3+r*2+k*5+(R()*3|0))%SK.length];items.push({r,ty,nm,sk:sk[0],a:sk[1],b:sk[2]})}});return{id:i,name:c[0],price:c[1]*25,h:c[2],items}});
const DEF0=()=>({bal:1000,inv:[],opened:0,eq:{},ups:0,upw:0,v:2});
function norm(x){if(!x||typeof x!='object'||!Array.isArray(x.inv)||typeof x.bal!='number'||!isFinite(x.bal))return null;const s={...DEF0(),...x};s.inv=x.inv.filter(i=>i&&typeof i=='object'&&i.nm&&i.sk&&i.r>=0&&i.r<=4&&isFinite(i.p));if(!s.eq||typeof s.eq!='object')s.eq={};s.opened=+s.opened||0;s.ups=+s.ups||0;s.upw=+s.upw||0;return s}
let S=DEF0(),SV_OK=true,SV_T=0;
try{const x=norm(JSON.parse(localStorage.getItem('cases1')));if(x)S=x}catch(e){}
function save(){try{S.v=2;localStorage.setItem('cases1',JSON.stringify(S));SV_T=Date.now();SV_OK=true}catch(e){SV_OK=false}}
const $$=n=>'$'+(n<100?n.toFixed(2):Math.round(n).toLocaleString('ru'));
function wearLbl(w){return w<.07?'Прямо с завода':w<.15?'Немного поношенное':w<.38?'После полевых':w<.45?'Поношенное':'Закалённое в боях'}
function inst(t,cs){const w=Math.random();return{...t,id:Date.now()+Math.random(),w,p:+(cs.price*PM[t.r]*(1.2-w*.7)).toFixed(2)}}
function pick(cs){let r=Math.random()*100,a=0,ri=0;for(let i=0;i<5;i++){a+=RW[i];if(r<a){ri=i;break}}const p=cs.items.filter(i=>i.r===ri);return p[Math.random()*p.length|0]}
function el(t,wr){const d=document.createElement('div');d.className='it';d.style.setProperty('--c',RC[t.r]);d.innerHTML=`<div class="ic" style="--a:${t.a};--b:${t.b}">${GL[t.ty]}</div><div class="n">${t.nm}</div><div class="s">${t.sk}</div>`;return d}
function hud(){$('#bal').textContent=$$(S.bal);$('#cnt').textContent=S.inv.length;save()}
function tab(n){['shop','open','invsec'].forEach((s,i)=>$('#'+s).style.display=(i==n?'block':'none'));$('#t1').classList.toggle('on',n!=2);$('#t2').classList.toggle('on',n==2);if(n==2)renderInv()}
function renderCases(){const g=$('#cases');g.innerHTML='';cases.forEach(c=>{const d=document.createElement('div');d.className='case';d.style.setProperty('--h',c.h);d.tabIndex=0;d.innerHTML=`<div class="box">📦</div><h3 class="ru" style="font-size:16px">${c.name}</h3><small>${$$(c.price)}</small>`;d.onclick=()=>openCase(c);d.onkeydown=e=>{if(e.key=='Enter')openCase(c)};g.appendChild(d)})}
let cur=null,fast=false,busy=false;
function openCase(c){cur=c;tab(1);$('#ctitle').textContent='Кейс «'+c.name+'»';$('#btnOpen').textContent='Открыть за '+$$(c.price);$('#cstat').textContent='Открыто всего: '+S.opened;const s=$('#strip');s.style.transition='none';s.style.transform='translateX(0)';s.innerHTML='';for(let i=0;i<14;i++)s.appendChild(el(c.items[i%c.items.length]));const ct=$('#contents');ct.innerHTML='';[...c.items].sort((a,b)=>b.r-a.r).forEach(t=>ct.appendChild(el(t)))}
$('#btnFast').onclick=()=>{fast=!fast;$('#btnFast').textContent='Быстрое открытие: '+(fast?'вкл':'выкл')};
$('#btnOpen').onclick=()=>{
  if(busy||!cur)return;if(S.bal<cur.price){$('#btnOpen').textContent='Не хватает денег. Играй матчи или введи промокод';return}
  busy=true;S.bal=+(S.bal-cur.price).toFixed(2);S.opened++;hud();$('#btnOpen').disabled=true;$('#cstat').textContent='Открыто всего: '+S.opened;
  const w=pick(cur),WI=48,N=60,s=$('#strip');s.innerHTML='';
  for(let i=0;i<N;i++)s.appendChild(el(i==WI?w:pick(cur)));
  const box=s.parentElement.clientWidth,off=(Math.random()-.5)*110,x=-(WI*158+75)+box/2+off;
  s.style.transition='none';s.style.transform='translateX(0)';void s.offsetWidth;
  const dur=fast?1.2:6.5;
  s.style.transition=`transform ${dur}s cubic-bezier(.1,.75,.12,1)`;s.style.transform=`translateX(${x}px)`;
  setTimeout(()=>{const it=inst(w,cur);S.inv.push(it);hud();busy=false;$('#btnOpen').disabled=false;showReveal(it)},dur*1000+250)};
let shown=null;
function showReveal(it){shown=it;const c=RC[it.r];$('#rcard').style.setProperty('--g',c);$('#rrar').textContent=RL[it.r];$('#rrar').style.color=c;$('#ric').innerHTML=`<div class="bigpic"><span class="gl">${GL[it.ty]}</span>${skTag(it)}</div>`;$('#rname').textContent=it.nm+' | '+it.sk;$('#rinfo').textContent=wearLbl(it.w)+' · '+$$(it.p);$('#rcard').style.animation='none';void $('#rcard').offsetWidth;$('#rcard').style.animation='';$('#reveal').classList.add('on')}
$('#rok').onclick=()=>$('#reveal').classList.remove('on');
$('#rsell').onclick=()=>{sell(shown.id);$('#reveal').classList.remove('on')};
$('#rinspect').onclick=()=>inspect(shown);
function sell(id){const i=S.inv.findIndex(x=>x.id==id);if(i<0)return;S.bal=+(S.bal+S.inv[i].p).toFixed(2);S.inv.splice(i,1);hud();if($('#invsec').style.display!='none')renderInv()}
function renderInv(){const g=$('#inv');g.innerHTML='';const L=[...S.inv].sort((a,b)=>b.r-a.r||b.p-a.p);$('#invval').textContent='Стоимость: '+$$(S.inv.reduce((a,b)=>a+b.p,0));if(!L.length){g.innerHTML='<p class="mu">Здесь пока пусто. Открой кейс, и предмет появится здесь.</p>';return}
 L.forEach(t=>{const d=el(t);d.querySelector('.n').textContent=wearLbl(t.w)+' · '+$$(t.p);const r=document.createElement('div');r.className='row';r.innerHTML='<button>Осмотреть</button><button>Продать</button>';r.children[0].onclick=()=>inspect(t);r.children[1].onclick=()=>sell(t.id);d.appendChild(r);g.appendChild(d)})}
$('#sellAll').onclick=()=>{S.inv.filter(x=>x.r<3).forEach(x=>S.bal+=x.p);S.bal=+S.bal.toFixed(2);S.inv=S.inv.filter(x=>x.r>=3);hud();renderInv()};

$('#t1').onclick=()=>tab(0);$('#t2').onclick=()=>tab(2);$('#back').onclick=()=>tab(0);

/* ---------- 3D осмотр ---------- */
let R3=null;
function init3(){const cv=$('#cv');const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));const sc=new THREE.Scene();const cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,0,7);

 a.f.quaternion.setFromUnitVectors(dn,fw)}

<div id="lob0"><p class="mu" style="margin:0">Введи код друга или создай свою комнату</p><div class="lobr"><input id="lobIn" placeholder="КОД" maxlength="5" autocomplete="off"><button id="lobJoin">Войти</button></div><div class="lobor">ИЛИ</div><button class="go" id="lobNew">Создать лобби</button></div>
<div id="lob1"><span class="mu">Код лобби</span><div id="lobCode"></div><div class="mu" id="lobCnt"></div><div class="lobr"><button id="lobCopy" style="flex:1">Копировать код</button><button id="lobLeave" style="flex:1">Выйти из лобби</button></div></div>
<p id="lobMsg" class="mu"></p><button id="lobClose">Закрыть</button></div></div>`);
const lobM=$('#lobM'),lobMsg=(t,bad)=>{const m=$('#lobMsg');m.textContent=t||'';m.style.color=bad?'#ff7a7a':''};
function lobSync(){const inL=!!NET.code;$('#lob0').style.display=inL?'none':'grid';$('#lob1').style.display=inL?'grid':'none';$('#lobCode').textContent=NET.code;$('#lobCnt').textContent='Игроков: '+NET.pl.size;
  const b=$('#lobBadge');b.classList.toggle('on',inL);b.innerHTML=inL?'ЛОББИ <b>'+esc(NET.code)+'</b> · '+NET.pl.size:''}
function lobOpen(){lobSync();lobMsg('');lobM.classList.add('on');setTimeout(()=>{const i=$('#lobIn');if(i&&i.offsetParent)i.focus()},40)}
function lobClose(){lobM.classList.remove('on')}
function lobNet(){const had=!!NET.s,s=netOn();if(s&&!had)s.once('connect_error',()=>lobMsg('Нет связи с сервером лобби',1));return s}
const lobNoSrv='Сервер лобби недоступен. Запусти игру через server.js (см. README).';
$('#lobNew').onclick=()=>{const s=lobNet();if(!s)return lobMsg(lobNoSrv,1);lobMsg('Создаём лобби…');
  s.timeout(6000).emit('lobby:create',{name:nickVal()},(e,r)=>{if(e||!r)return lobMsg('Сервер не ответил, попробуй ещё раз',1);if(!r.ok)return lobMsg(r.err,1);lobMsg('');lobClose();toast('Лобби создано'+(NET.code?' · код '+esc(NET.code):''))})};
function lobJoin(){const c=$('#lobIn').value.trim().toUpperCase();if(c.length<5)return lobMsg('Введи код из 5 символов',1);const s=lobNet();if(!s)return lobMsg(lobNoSrv,1);lobMsg('Входим…');
  s.timeout(6000).emit('lobby:join',{code:c,name:nickVal()},(e,r)=>{if(e||!r)return lobMsg('Сервер не ответил, попробуй ещё раз',1);if(!r.ok)return lobMsg(r.err,1);lobMsg('');$('#lobIn').value='';lobClose();toast('Ты в лобби · код '+esc(c))})}
$('#lobJoin').onclick=lobJoin;$('#lobIn').onkeydown=e=>{if(e.key=='Enter')lobJoin()};$('#lobIn').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};
$('#lobCopy').onclick=()=>{try{navigator.clipboard.writeText(NET.code);lobMsg('Код скопирован')}catch(e){lobMsg('Код: '+NET.code)}};
$('#lobLeave').onclick=()=>{netLeave();lobMsg('');lobClose()};$('#lobClose').onclick=lobClose;
lobM.onclick=e=>{if(e.target===lobM)lobClose()};addEventListener('keydown',e=>{if(e.key=='Escape'&&lobM.classList.contains('on'))lobClose()});
$('#hlobby').onclick=lobOpen;$('#lobBadge').onclick=lobOpen;

/* 3D: 4 дополнительных подиума, пустые или с оперативниками подключившихся */
const POD={g:null,sl:[],map:new Map(),k:0,on:0,sig:'',t:0,me:null},POX=[[-3.3,-.5],[3.3,-.5],[-6.5,-1.9],[6.5,-1.9]],POC=['#ef4444','#f59e0b','#22c55e','#a855f7','#06b6d4','#ec4899'];
const pBack=p=>1+2.70158*(p-1)**3+1.70158*(p-1)**2;
function podLab(txt,dim){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='600 32px "Golos Text",sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=6;x.strokeStyle='#000';x.fillStyle=dim?'#8b93a7':'#fff';x.strokeText(txt,128,34);x.fillText(txt,128,34);
  const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));sp.scale.set(2.6,.65,1);sp.userData.txt=txt;return sp}
function podSetLab(o,key,txt,dim,y){let s=o[key];if(s&&s.userData.txt===txt&&s.userData.dim===!!dim)return;if(s){s.parent.remove(s);s.material.map.dispose();s.material.dispose()}
  s=o[key]=podLab(txt,dim);s.userData.dim=!!dim;s.position.y=y;o.g?o.g.add(s):HB.sc.add(s)}
function podInit(){if(POD.g||!HB)return;const g=POD.g=new THREE.Group();g.visible=false;
  POX.forEach((p,i)=>{const sg=new THREE.Group(),ped=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.5,.12,48),new THREE.MeshStandardMaterial({color:'#1b2238',metalness:.6,roughness:.4})),ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,.025,8,64),new THREE.MeshBasicMaterial({color:'#475569',transparent:true}));
    ped.position.y=-.06;ring.rotation.x=PI/2;sg.add(ped,ring);sg.position.set(p[0],0,p[1]);sg.scale.setScalar(.001);g.add(sg);
    const sl={g:sg,ring,x:p[0],id:null,ag:null,pk:0,lab:null};podSetLab(sl,'lab','ОЖИДАНИЕ…',1,1.6);POD.sl.push(sl)});
  HB.sc.add(g);POD.me=null}
function podClear(sl){if(sl.ag){sl.g.remove(sl.ag);disposeObj(sl.ag);sl.ag=null}sl.id=null;podSetLab(sl,'lab','ОЖИДАНИЕ…',1,1.6)}
function podFill(sl,p){podClear(sl);sl.id=p.id;const ci=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0)%6,ag=mkAgent({...AGD,a:POC[ci],b:'#111827'});ag.scale.setScalar(.001);ag.rotation.y=-Math.sign(sl.x)*.3;sl.g.add(ag);sl.ag=ag;sl.pk=0}
function podSync(){if(!HB)return;const s=NET.s,on=!!(NET.code&&s),ids=on?[...NET.pl.keys()].filter(i=>i!==s.id):[];
  const sig=(on?NET.code:'')+'|'+NET.host+'|'+PROF.av+'|'+(on?[...NET.pl.values()].map(p=>p.id+':'+p.n).join(','):'');if(sig===POD.sig)return;POD.sig=sig;POD.on=on?1:0;podInit();if(!POD.g)return;
  POD.map.forEach((ix,id)=>{if(!ids.includes(id)){podClear(POD.sl[ix]);POD.map.delete(id)}});
  ids.forEach(id=>{if(POD.map.has(id))return;const used=new Set(POD.map.values()),ix=POD.sl.findIndex((q,k)=>!used.has(k));if(ix<0)return;POD.map.set(id,ix);podFill(POD.sl[ix],NET.pl.get(id))});
  POD.map.forEach((ix,id)=>{const p=NET.pl.get(id);if(p)podSetLab(POD.sl[ix],'lab',(id===NET.host?'👑 ':'')+p.n,0,3.1)});
  const me=on&&NET.pl.get(s.id);if(me)podSetLab(POD,'me',(NET.host===s.id?'👑 ':'')+AVS[PROF.av]+' '+me.n+' (ты)',0,3.15);if(POD.me)POD.me.visible=!!me;
  lobSync()}
function podTick(dt,T){const g=POD.g;if(!g)return;POD.k+=((POD.on?1:0)-POD.k)*(1-Math.exp(-dt*5));if(POD.k<.002&&!POD.on)POD.k=0;g.visible=POD.k>0;
  POD.sl.forEach((sl,i)=>{const kk=Math.max(0,Math.min(1,POD.k*1.5-i*.12)),fl=!!sl.ag;sl.g.scale.setScalar(Math.max(.001,pBack(kk)));
    sl.ring.material.color.set(fl?'#38bdf8':'#475569');sl.ring.material.opacity=fl?1:.45+.3*sn(T*2+i);if(sl.lab)sl.lab.material.opacity=fl?1:.55+.3*sn(T*2+i);
    if(sl.ag){const a=sl.ag;sl.pk=Math.min(1,sl.pk+dt*2.2);a.scale.setScalar(Math.max(.001,1.2*pBack(sl.pk)));a.position.y=sn(T*1.6+i)*.01;a.arms[0].rotation.set(.05+sn(T*1.6+i)*.03,0,.08);a.arms[1].rotation.set(.05-sn(T*1.6+i)*.03,0,-.08);a.arms.forEach(q=>q.f.rotation.x=-.25);a.head.rotation.y=sn(T*.7+i)*.12}});
  if(POD.me){POD.me.material.opacity=POD.k}
  const cv=$('#hcv'),asp=(cv.clientWidth/cv.clientHeight)||1.78,far=Math.min(30,Math.max(7.5,8.2/(.3057*asp)));HB.cam.position.z=7.5+(far-7.5)*POD.k;HB.cam.position.y=1.5+.8*POD.k}
const _hf3=homeFrame;homeFrame=function(){if(HB&&hm.classList.contains('on')){const n=performance.now(),dt=Math.min(.05,(n-(POD.t||n))/1e3);POD.t=n;try{podSync();podTick(dt,n/1e3)}catch(e){console.error(e)}}_hf3()};
const _lbr=lbRender;lbRender=function(){_lbr();try{podSync();lobSync()}catch(e){console.error(e)}};

hints();
openHome();
})();
